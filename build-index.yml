name: Régénérer l'index des questions

on:
  push:
    paths:
      - "questions/q-*.json"   # à chaque ajout ou modification d'une question
  workflow_dispatch:           # permet aussi le lancement manuel

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build-index.js
      - name: Enregistrer l'index s'il a changé
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add questions/index.json
          git diff --staged --quiet || (git commit -m "Régénération de index.json" && git push)
